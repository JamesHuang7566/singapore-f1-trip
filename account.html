<div class="account-wrapper" style="display: flex; flex-direction: column; gap: 16px;">

  <!-- 匯率與總額統計看板 -->
  <div class="card" style="background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span style="font-size: 0.8rem; color: #94a3b8; font-weight: 600;">消費總額統計</span>
      <div style="font-size: 0.75rem; color: #cbd5e1; display: flex; align-items: center; gap: 4px;">
        匯率: 1 SGD ≈ <input type="number" id="fxRate" value="24.5" step="0.1" style="width: 50px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; color: #fff; text-align: center; font-size: 0.75rem;" onchange="updateSummary()" /> TWD
      </div>
    </div>

    <div style="display: flex; justify-content: space-around; text-align: center; padding: 10px 0;">
      <div>
        <div style="font-size: 0.75rem; color: #94a3b8;">新幣總計 (SGD)</div>
        <div id="totalSGD" style="font-size: 1.5rem; font-weight: 800; color: #38bdf8;">$ 0.00</div>
      </div>
      <div style="border-right: 1px solid rgba(255,255,255,0.1);"></div>
      <div>
        <div style="font-size: 0.75rem; color: #94a3b8;">折合台幣 (TWD)</div>
        <div id="totalTWD" style="font-size: 1.5rem; font-weight: 800; color: #facc15;">NT$ 0</div>
      </div>
    </div>
  </div>

  <!-- 新增記帳表單 -->
  <div class="card">
    <h2 class="card-title" style="font-size: 1rem;">➕ 新增消費支出</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
      <select id="accCategory" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; background: #fff;">
        <option value="🍽️ 餐飲">🍽️ 餐飲美食</option>
        <option value="🚕 交通">🚕 交通接駁</option>
        <option value="🛍️ 購物">🛍️ 紀念購物</option>
        <option value="🏎️ F1">🏎️ F1 周邊</option>
        <option value="🎟️ 門票">🎟️ 景點門票</option>
        <option value="📦 其他">📦 其他支出</option>
      </select>

      <select id="accCurrency" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; background: #fff;">
        <option value="SGD">新幣 (SGD)</option>
        <option value="TWD">台幣 (TWD)</option>
      </select>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 8px;">
      <input type="text" id="accItem" placeholder="項目名稱 (例如: 亞坤早餐)" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
      <input type="number" id="accAmount" placeholder="金額" step="0.1" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;" />
    </div>

    <button onclick="addRecord()" style="margin-top: 10px; width: 100%; background: var(--primary); color: #fff; border: none; padding: 9px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer;">加入明細</button>
  </div>

  <!-- 消費記錄清單 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 class="card-title" style="font-size: 1rem; margin-bottom: 0;">📋 消費明細列表</h2>
      <button onclick="clearAllRecords()" style="font-size: 0.72rem; color: #94a3b8; background: none; border: none; cursor: pointer; text-decoration: underline;">清空全部</button>
    </div>

    <div id="recordsList" style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px;">
      <!-- 動態插入記錄 -->
    </div>
  </div>

</div>

<script>
  // 記帳模組邏輯
  function initAccountBook() {
    renderRecords();
    updateSummary();
  }

  function getRecords() {
    return JSON.parse(localStorage.getItem('f1_trip_expenses') || '[]');
  }

  function saveRecords(records) {
    localStorage.setItem('f1_trip_expenses', JSON.stringify(records));
  }

  function addRecord() {
    const item = document.getElementById('accItem').value.trim();
    const amount = parseFloat(document.getElementById('accAmount').value);
    const category = document.getElementById('accCategory').value;
    const currency = document.getElementById('accCurrency').value;

    if (!item || isNaN(amount) || amount <= 0) {
      alert('請填寫完整項目名稱與有效金額！');
      return;
    }

    const records = getRecords();
    records.unshift({
      id: Date.now(),
      item,
      amount,
      category,
      currency,
      date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    });

    saveRecords(records);
    document.getElementById('accItem').value = '';
    document.getElementById('accAmount').value = '';
    renderRecords();
    updateSummary();
  }

  function deleteRecord(id) {
    let records = getRecords();
    records = records.filter(r => r.id !== id);
    saveRecords(records);
    renderRecords();
    updateSummary();
  }

  function clearAllRecords() {
    if (confirm('確定要清空所有記帳明細嗎？')) {
      localStorage.removeItem('f1_trip_expenses');
      renderRecords();
      updateSummary();
    }
  }

  function renderRecords() {
    const list = document.getElementById('recordsList');
    if (!list) return;
    const records = getRecords();

    if (records.length === 0) {
      list.innerHTML = `<div style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 20px 0;">尚無消費記錄，點擊上方開始記錄！</div>`;
      return;
    }

    list.innerHTML = records.map(r => `
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #f1f5f9;">
        <div>
          <div style="font-weight: 600; font-size: 0.88rem; color: #1e293b;">${r.category} ${r.item}</div>
          <div style="font-size: 0.7rem; color: #94a3b8;">${r.date}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="font-weight: 700; font-size: 0.92rem; color: ${r.currency === 'SGD' ? '#0284c7' : '#059669'};">
            ${r.currency === 'SGD' ? '$' : 'NT$'} ${r.amount.toFixed(1)}
          </div>
          <button onclick="deleteRecord(${r.id})" style="border: none; background: none; color: #cbd5e1; cursor: pointer; font-size: 0.9rem;">✕</button>
        </div>
      </div>
    `).join('');
  }

  function updateSummary() {
    const records = getRecords();
    const fxRate = parseFloat(document.getElementById('fxRate')?.value || 24.5);
    let totalSGD = 0;
    let totalTWD = 0;

    records.forEach(r => {
      if (r.currency === 'SGD') {
        totalSGD += r.amount;
        totalTWD += r.amount * fxRate;
      } else {
        totalTWD += r.amount;
        totalSGD += r.amount / fxRate;
      }
    });

    const sgdEl = document.getElementById('totalSGD');
    const twdEl = document.getElementById('totalTWD');
    if (sgdEl) sgdEl.innerText = `$ ${totalSGD.toFixed(2)}`;
    if (twdEl) twdEl.innerText = `NT$ ${Math.round(totalTWD).toLocaleString()}`;
  }

  // 確保載入時初次觸發
  initAccountBook();
</script>
