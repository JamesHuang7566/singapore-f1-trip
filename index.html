<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Singapore & F1 Grand Prix Itinerary</title>
  <style>
    :root {
      --primary: #d32f2f;
      --primary-dark: #b71c1c;
      --accent: #ffb300;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --timeline-line: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      padding: 35px 20px 25px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 1.7rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .badge-f1 {
      display: inline-block;
      background-color: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 999px;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 頂部導航 Tabs 固定置頂 */
    .tabs-wrapper {
      position: sticky;
      top: 0;
      background: rgba(248, 250, 252, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 12px 0;
      gap: 10px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(211, 47, 47, 0.3);
    }

    /* 動態載入容器 */
    #content-container {
      min-height: 400px;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 時間軸與卡片共用樣式 */
    .timeline {
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 15px;
      bottom: 20px;
      width: 2px;
      background: var(--timeline-line);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 22px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 3px solid var(--primary);
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .card.f1-card {
      border-left: 4px solid var(--primary);
      background: #fffafb;
    }

    .card-time {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      background: #fee2e2;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .card-time.f1-badge {
      background: var(--primary);
      color: #fff;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-content {
      font-size: 0.92rem;
      color: #334155;
    }

    .card-content ul {
      list-style-type: none;
      margin-top: 6px;
    }

    .card-content li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 6px;
    }

    .card-content li::before {
      content: "•";
      position: absolute;
      left: 4px;
      color: var(--primary);
      font-weight: bold;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 500;
    }

    .tag.highlight {
      background: #fef3c7;
      color: #92400e;
      font-weight: 600;
    }

    .notice-box {
      margin-top: 12px;
      background: #eff6ff;
      border-left: 3px solid #3b82f6;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #1e40af;
      border-radius: 0 8px 8px 0;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>🇸🇬 新加坡 ＆ F1 賽車之旅</h1>
    <p>2026/10/08 - 10/12 • 5 Days 4 Nights</p>
    <div class="badge-f1">F1 Singapore GP • Skyline Grandstand</div>
  </header>

  <!-- 頂部固定 Tab 導航 -->
  <div class="tabs-wrapper">
    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" onclick="loadDay(1)">10/8 (四) Day 1</button>
        <button class="tab-btn" onclick="loadDay(2)">10/9 (五) Day 2</button>
        <button class="tab-btn" onclick="loadDay(3)">10/10 (六) Day 3</button>
        <button class="tab-btn" onclick="loadDay(4)">10/11 (日) Day 4</button>
        <button class="tab-btn" onclick="loadDay(5)">10/12 (一) Day 5</button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- 各天內容將動態載入至此 -->
    <div id="content-container"></div>
  </main>

  <footer>
    <p>Have an amazing trip to Singapore! 🏎️💨</p>
  </footer>

  <script>
    async function loadDay(dayNum) {
      // 1. 切換按鈕 active 樣式
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, index) => {
        if (index === dayNum - 1) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      buttons[dayNum - 1].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

      // 2. 非同步載入對應天的 HTML 片段
      const container = document.getElementById('content-container');
      try {
        const response = await fetch(`day${dayNum}.html`);
        if (!response.ok) throw new Error('Network error');
        const html = await response.text();
        container.innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: #ef4444;">載入失敗，請確認 day${dayNum}.html 是否存在，或使用 Local Web Server (如 Live Server) 瀏覽。</div>`;
      }
    }

    // 頁面初次載入預設顯示 Day 1
    document.addEventListener('DOMContentLoaded', () => {
      loadDay(1);
    });
  </script>

</body>
</html>
