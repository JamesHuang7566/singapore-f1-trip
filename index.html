<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Singapore Oct 8 - 12, 2026 | F1 新加坡大獎賽之旅</title>
  <style>
    :root {
      --primary: #e10600; /* F1 經典紅 */
      --primary-dark: #b30000;
      --accent: #ffb800;
      --bg: #0f172a;
      --page-bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --timeline-line: #cbd5e1;
    }

    html {
      scrollbar-gutter: stable;
      overflow-y: scroll;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--page-bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* 頂部固定 Header */
    header {
      background: linear-gradient(135deg, #0b0f19 0%, #1e293b 100%);
      color: #fff;
      padding: 20px 14px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .header-top {
      text-align: center;
      margin-bottom: 12px;
    }

    .header-badge {
      display: inline-block;
      background: rgba(225, 6, 0, 0.2);
      border: 1px solid var(--primary);
      color: #ff6b6b;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    header p.sub {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    /* 航班資訊雙卡片 */
    .flight-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto;
    }

    .flight-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
    }

    .flight-type {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 3px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 3px;
    }

    .flight-type .tag {
      background: var(--primary);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .flight-row {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: #cbd5e1;
    }

    .flight-time {
      font-weight: 700;
      color: #fff;
      font-size: 0.85rem;
    }

    .flight-port {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* 導航 Tabs 欄位 */
    .tabs-wrapper {
      position: sticky;
      top: 0;
      background: rgba(248, 250, 252, 0.98);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 8px;
    }

    .tabs-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      padding: 8px 0;
      width: 100%;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 1px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 0;
    }

    .tab-btn .btn-top {
      font-size: 0.65rem;
      line-height: 1.1;
      opacity: 0.85;
      white-space: nowrap;
    }

    .tab-btn .btn-main {
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.2;
      margin-top: 2px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(225, 6, 0, 0.3);
    }

    .tab-btn.active .btn-top {
      opacity: 1;
      color: #ffe4e6;
    }

    .tab-btn.special-tab {
      background: #f1f5f9;
      color: #334155;
    }

    .tab-btn.special-tab.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.3);
    }

    /* 動態載入容器 */
    #content-container {
      margin-top: 14px;
      padding: 0 6px;
      min-height: 450px;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 共用 Timeline 與卡片樣式 */
    .timeline {
      position: relative;
      padding-left: 24px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 15px;
      bottom: 20px;
      width: 2px;
      background: var(--timeline-line);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 18px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 3px solid var(--primary);
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 15px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .card.f1-card {
      border-left: 4px solid var(--primary);
      background: #fffafb;
    }

    .card-time {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: #fee2e2;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 7px;
    }

    .card-time.f1-badge {
      background: var(--primary);
      color: #fff;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-content {
      font-size: 0.88rem;
      color: #334155;
    }

    .card-content ul {
      list-style-type: none;
      margin-top: 6px;
    }

    .card-content li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 6px;
    }

    .card-content li::before {
      content: "•";
      position: absolute;
      left: 3px;
      color: var(--primary);
      font-weight: bold;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 500;
    }

    .tag.highlight {
      background: #fef3c7;
      color: #92400e;
      font-weight: 600;
    }

    .notice-box {
      margin-top: 12px;
      background: #eff6ff;
      border-left: 3px solid #3b82f6;
      padding: 9px 12px;
      font-size: 0.82rem;
      color: #1e40af;
      border-radius: 0 8px 8px 0;
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- 固定 Header -->
  <header>
    <div class="container">
      <div class="header-top">
        <div class="header-badge">Singapore Oct 8 - 12, 2026</div>
        <h1>F1 新加坡大獎賽之旅</h1>
        <p class="sub">Skyline Grandstand • Village Hotel Bugis</p>
      </div>

      <!-- 航班卡片 -->
      <div class="flight-container">
        <!-- 去程 -->
        <div class="flight-card">
          <div class="flight-type">
            <span>去程 • 長榮航空</span>
            <span class="tag">BR215</span>
          </div>
          <div class="flight-row">
            <div>
              <div class="flight-time">09:25</div>
              <div class="flight-port">TPE 桃園 T2</div>
            </div>
            <div style="align-self: center; color: #64748b;">➔</div>
            <div style="text-align: right;">
              <div class="flight-time">13:55</div>
              <div class="flight-port">SIN 樟宜 T3</div>
            </div>
          </div>
        </div>

        <!-- 回程 -->
        <div class="flight-card">
          <div class="flight-type">
            <span>回程 • 長榮航空</span>
            <span class="tag">BR226</span>
          </div>
          <div class="flight-row">
            <div>
              <div class="flight-time">13:10</div>
              <div class="flight-port">SIN 樟宜 T3</div>
            </div>
            <div style="align-self: center; color: #64748b;">➔</div>
            <div style="text-align: right;">
              <div class="flight-time">17:45</div>
              <div class="flight-port">TPE 桃園 T2</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 導航列：預設高亮選中 D1 抵達日 -->
  <div class="tabs-wrapper">
    <div class="container">
      <div class="tabs-grid">
        <button class="tab-btn special-tab" onclick="loadPage('info.html', this)">
          <span class="btn-main">ℹ️ 資訊</span>
        </button>
        <button id="tab-day1" class="tab-btn active" onclick="loadPage('day1.html', this)">
          <span class="btn-top">D1 抵達日</span>
          <span class="btn-main">10/8(四)</span>
        </button>
        <button class="tab-btn" onclick="loadPage('day2.html', this)">
          <span class="btn-top">D2 練習/衝刺排位</span>
          <span class="btn-main">10/9(五)</span>
        </button>
        <button class="tab-btn" onclick="loadPage('day3.html', this)">
          <span class="btn-top">D3 衝刺賽/正賽排位</span>
          <span class="btn-main">10/10(六)</span>
        </button>
        <button class="tab-btn" onclick="loadPage('day4.html', this)">
          <span class="btn-top">D4 正賽</span>
          <span class="btn-main">10/11(日)</span>
        </button>
        <button class="tab-btn" onclick="loadPage('day5.html', this)">
          <span class="btn-top">D5 回家</span>
          <span class="btn-main">10/12(一)</span>
        </button>
        <button class="tab-btn special-tab" onclick="loadPage('account.html', this)">
          <span class="btn-main">💰 記帳</span>
        </button>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="content-container"></div>
  </main>

  <footer>
    <p>Singapore Grand Prix 2026 • Have a great race trip! 🏎️💨</p>
  </footer>

  <!-- 頁面載入器：會自動觸發並執行子檔案內部寫的所有 <script>！ -->
  <script>
    async function loadPage(pageUrl, btnElement) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      }

      const container = document.getElementById('content-container');
      try {
        const response = await fetch(pageUrl);
        if (!response.ok) throw new Error('Network error');
        const html = await response.text();
        
        // 1. 將 HTML 插入容器
        container.innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 2. 關鍵修正：解析出該頁自己寫的 <script> 並直接動態執行它！
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } catch (err) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: #ef4444;">載入失敗 (${pageUrl})，請確認檔案是否存在，或透過 Web Server (如 Live Server) 預覽。</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const day1Btn = document.getElementById('tab-day1');
      loadPage('day1.html', day1Btn);
    });
  </script>

</body>
</html>
